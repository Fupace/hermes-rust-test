name: CI/CD
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  RUST_VERSION: "stable"
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: cargo fmt
        run: cargo fmt --check
      - name: cargo clippy
        run: cargo clippy -- -D warnings -A clippy::uninlined_format_args -A clippy::bind_instead_of_map -A clippy::map_flatten -A clippy::needless_borrows_for_generic_args

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
      - uses: Swatinem/rust-cache@v2
      - name: cargo test
        run: cargo test --verbose

  build-and-push:
    needs: [lint, test]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Set lowercase image name
        run: echo "IMAGE_NAME=$(echo '${{ env.REGISTRY }}/${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.IMAGE_NAME }}:latest

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Deploy
        env:
          K8S_CERT_B64: ${{ secrets.K8S_CLIENT_CERT }}
          K8S_KEY_B64: ${{ secrets.K8S_CLIENT_KEY }}
          K8S_HOST: ${{ vars.K8S_HOST }}
          K8S_PORT: ${{ vars.K8S_PORT }}
          APP_NAME: ${{ vars.APP_NAME }}
          DOMAIN: ${{ vars.DOMAIN }}
          K8S_NAMESPACE: ${{ vars.K8S_NAMESPACE || 'default' }}
        run: |
          export IMAGE_TAG="$(echo '${{ env.REGISTRY }}/${{ github.repository }}' | tr '[:upper:]' '[:lower:]'):${{ github.sha }}"
          python3 k8s/deploy.py
